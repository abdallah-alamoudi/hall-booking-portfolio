version: '3.9'

services:
  api:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    volumes:
      - ../..:/app
    ports:
      - "4000:4000"

  dashboard:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:dashboard"
    volumes:
      - ../..:/app
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - dashboard
    ports:
      - "8080:80"
    volumes:
      - ../nginx:/etc/nginx/conf.d
